name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: Run the plugin eval suite (uses ANTHROPIC_API_KEY, costs money)
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests for bundled assets (parsers, GATT queue, health mapping)
        run: node --experimental-strip-types --test skills/*/assets/*.test.ts

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate manifests and components
        run: |
          claude plugin validate .
          claude plugin validate .claude-plugin/plugin.json
          claude plugin validate skills
          claude plugin validate agents
          claude plugin validate commands

  evals:
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    needs: validate
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run evals
        run: claude plugin eval . --trust-plugin --runs 1 --no-publish --threshold 0.8 --json evals/results/ci.json --report evals/results/report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
